name: Auto Deploy Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build static export (CI — no Node on PC or server)
        env:
          BACKEND_URL: https://coimbatoreproperties.org
          NEXT_PUBLIC_BACKEND_URL: https://coimbatoreproperties.org
          NEXT_PUBLIC_APP_BASE_PATH: ''
        run: |
          npm ci --no-audit --no-fund
          npm run build:deploy

      - name: Configure SSH for deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY_ILF }}
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME }}
        run: |
          set -e
          SSH_DIR="${HOME}/.ssh"
          mkdir -p "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "${SSH_DIR}/deploy_key"
          chmod 600 "${SSH_DIR}/deploy_key"
          {
            echo 'Host hostinger-deploy'
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${DEPLOY_USER}"
            echo '  Port 65002'
            echo "  IdentityFile ${SSH_DIR}/deploy_key"
            echo '  StrictHostKeyChecking no'
            echo '  ConnectTimeout 60'
            echo '  ServerAliveInterval 30'
            echo '  ServerAliveCountMax 3'
          } > "${SSH_DIR}/config"
          chmod 600 "${SSH_DIR}/config"
          echo "SSH_DIR=${SSH_DIR}" >> "$GITHUB_ENV"
          echo "RSYNC_SSH=ssh -F ${SSH_DIR}/config" >> "$GITHUB_ENV"

      - name: Backup server secrets
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "SSH backup attempt $attempt/3..."
            if ssh -F "${SSH_DIR}/config" hostinger-deploy 'set -e
              TARGET=/home/u221026474/domains/coimbatoreproperties.org/public_html
              BACKUP_DIR=/tmp/cp-deploy-backup-latest
              rm -rf "$BACKUP_DIR"
              mkdir -p "$BACKUP_DIR"
              mkdir -p "$TARGET"
              cd "$TARGET"
              if [ -f application/config/database.php ]; then cp application/config/database.php "$BACKUP_DIR/database.php"; fi
              if [ -f application/config/whatsapp.local.php ]; then cp application/config/whatsapp.local.php "$BACKUP_DIR/whatsapp.local.php"; fi
              if [ -f application/config/firebase_service_account.json ]; then cp application/config/firebase_service_account.json "$BACKUP_DIR/firebase_service_account.json"; fi
              if [ -f .env ]; then cp .env "$BACKUP_DIR/.env"; fi
              if [ -f deploy.local.php ]; then cp deploy.local.php "$BACKUP_DIR/deploy.local.php"; fi
              echo "Secrets backed up to $BACKUP_DIR"'; then
              exit 0
            fi
            echo "SSH failed, waiting 45s before retry..."
            sleep 45
          done
          echo "Could not connect to Hostinger SSH on port 65002 after 3 attempts."
          exit 1

      - name: Rsync release to server
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Rsync attempt $attempt/3..."
            if rsync -avz --delete \
              -e "${RSYNC_SSH}" \
              --exclude-from=deploy/rsync-exclude.txt \
              deploy/release/ \
              hostinger-deploy:/home/u221026474/domains/coimbatoreproperties.org/public_html/; then
              exit 0
            fi
            echo "Rsync failed, waiting 45s before retry..."
            sleep 45
          done
          exit 1

      - name: Restore secrets and set site URL
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "SSH restore attempt $attempt/3..."
            if ssh -F "${SSH_DIR}/config" hostinger-deploy 'set -e
              TARGET=/home/u221026474/domains/coimbatoreproperties.org/public_html
              BACKUP_DIR=/tmp/cp-deploy-backup-latest
              cd "$TARGET"

              mkdir -p application/config uploads assets/uploads
              OLD=/home/u221026474/domains/superfinelabels.in/public_html/cp

              if [ -f "$BACKUP_DIR/database.php" ]; then cp "$BACKUP_DIR/database.php" application/config/database.php; fi
              if [ -f "$BACKUP_DIR/whatsapp.local.php" ]; then cp "$BACKUP_DIR/whatsapp.local.php" application/config/whatsapp.local.php; fi
              if [ -f "$BACKUP_DIR/firebase_service_account.json" ]; then cp "$BACKUP_DIR/firebase_service_account.json" application/config/firebase_service_account.json; fi
              if [ -f "$BACKUP_DIR/.env" ]; then cp "$BACKUP_DIR/.env" .env; fi
              if [ -f "$BACKUP_DIR/deploy.local.php" ]; then cp "$BACKUP_DIR/deploy.local.php" deploy.local.php; fi

              db_is_stub=0
              if [ ! -f application/config/database.php ]; then
                db_is_stub=1
              elif grep -q "username.*root" application/config/database.php && grep -q "database.*property" application/config/database.php; then
                db_is_stub=1
              fi
              if [ "$db_is_stub" = 1 ] && [ -f "$OLD/application/config/database.php" ]; then
                cp "$OLD/application/config/database.php" application/config/database.php
                db_is_stub=0
              fi
              if [ "$db_is_stub" = 1 ] && [ -f application/config/database.php.example ]; then
                cp application/config/database.php.example application/config/database.php
              fi

              if [ -d "$OLD" ]; then
                if [ ! -f application/config/whatsapp.local.php ] && [ -f "$OLD/application/config/whatsapp.local.php" ]; then
                  cp "$OLD/application/config/whatsapp.local.php" application/config/whatsapp.local.php
                fi
                if [ ! -f application/config/firebase_service_account.json ] && [ -f "$OLD/application/config/firebase_service_account.json" ]; then
                  cp "$OLD/application/config/firebase_service_account.json" application/config/firebase_service_account.json
                fi
                if [ -d "$OLD/uploads" ]; then cp -an "$OLD/uploads/." uploads/; fi
                if [ -d "$OLD/assets/uploads" ]; then cp -an "$OLD/assets/uploads/." assets/uploads/; fi
              fi
              rm -rf "$BACKUP_DIR"

              if [ -f .env ]; then
                if grep -q "^BASE_URL=" .env; then
                  sed -i "s|^BASE_URL=.*|BASE_URL=https://coimbatoreproperties.org|" .env
                else
                  printf "\nBASE_URL=https://coimbatoreproperties.org\n" >> .env
                fi
              else
                printf "BASE_URL=https://coimbatoreproperties.org\n" > .env
              fi

              if [ ! -f application/config/config.php ]; then
                echo "ERROR: application/config/config.php is missing after deploy" >&2
                exit 1
              fi
              if [ ! -f application/config/database.php ]; then
                echo "ERROR: application/config/database.php is missing after deploy" >&2
                exit 1
              fi

              echo "Deployed static export + PHP from CI at $TARGET"
              ls -l application/config/config.php application/config/database.php'; then
              exit 0
            fi
            echo "SSH failed, waiting 45s before retry..."
            sleep 45
          done
          exit 1
